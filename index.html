<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiwe Apartments</title>
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="js/core.js" defer></script>
<script src="js/front.js" defer></script>
<script src="js/ops.js" defer></script>
<script src="js/admin.js" defer></script>
<script src="js/building.js" defer></script>
<script src="js/shifts.js" defer></script>
</head>
<body>

<div id="boot" class="boot"><img class="logo-img" src="img/logo.png" alt="Wiwe Apartments" width="120"><span>Loading…</span></div>

<div id="login" class="login hidden"></div>

<div class="corner" id="corner" aria-label="Appearance">
  <div class="theme-pick" role="radiogroup" aria-label="Colour theme">
    <button type="button" role="radio" class="sw sw-mono" data-t="mono" onclick="setTheme('mono')" title="Black and white" aria-label="Black and white theme"></button>
    <button type="button" role="radio" class="sw sw-cream" data-t="cream" onclick="setTheme('cream')" title="Black and cream" aria-label="Black and cream theme"></button>
    <button type="button" role="radio" class="sw sw-colour" data-t="colour" onclick="setTheme('colour')" title="Colourful" aria-label="Colourful theme"></button>
  </div>
  <button type="button" class="dark-switch" id="darkSwitch" role="switch" aria-checked="false" aria-label="Dark mode" title="Dark mode" onclick="toggleDark()"><span class="knob" id="darkIcon"></span></button>
</div>

<div id="app" class="app hidden">
  <header class="appbar">
    <button type="button" class="home-link" onclick="go('home')" aria-label="Home"><img class="logo-img" src="img/logo.png" alt="Wiwe Apartments"></button>
    <button type="button" class="sync" id="syncBadge" onclick="forceSync()"><span class="dot"></span><span id="syncText">Connecting…</span></button>
    <div class="me" id="meBox"></div>
  </header>
  <div class="main">
    <header class="topbar">
      <button class="btn small back-btn" id="backBtn" type="button" onclick="go('home')"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Home</button>
      <div class="titles">
        <span class="eyebrow" id="pageEyebrow"></span>
        <h1 id="pageTitle"></h1>
      </div>
      <div id="topActions" class="top-actions"></div>
    </header>
    <main id="view" class="content"></main>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card" id="modalCard">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" type="button" aria-label="Close" onclick="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
</body>
</html>
