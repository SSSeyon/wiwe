<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wiwe Apartments</title>
<meta name="theme-color" content="#4F46E5">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="js/core.js" defer></script>
<script src="js/front.js" defer></script>
<script src="js/ops.js" defer></script>
<script src="js/admin.js" defer></script>
<script src="js/building.js" defer></script>
<script src="js/shifts.js" defer></script>
<script src="js/phone.js" defer></script>
</head>
<body>

<div id="boot" class="boot"><img class="logo-img" src="img/logo.png" alt="Wiwe Apartments" width="120"><span>Loading…</span></div>

<div id="login" class="login hidden"></div>

<div class="corner" id="corner" aria-label="Appearance">
  <div class="theme-pick" id="themePick">
    <button type="button" class="sw sw-current" id="themeCurrent" onclick="toggleThemeMenu()" aria-haspopup="true" aria-expanded="false" title="Colour scheme" aria-label="Colour scheme"></button>
    <div class="theme-menu hidden" id="themeMenu" role="radiogroup" aria-label="Colour scheme">
      <button type="button" role="radio" class="tm-opt" data-t="colour" onclick="setTheme('colour')"><span class="sw sw-colour"></span>Colourful</button>
      <button type="button" role="radio" class="tm-opt" data-t="mono" onclick="setTheme('mono')"><span class="sw sw-mono"></span>Black &amp; white</button>
      <button type="button" role="radio" class="tm-opt" data-t="cream" onclick="setTheme('cream')"><span class="sw sw-cream"></span>Black &amp; cream</button>
    </div>
  </div>
  <button type="button" class="theme-btn" id="darkSwitch" aria-label="Switch to dark mode" title="Switch to dark mode" onclick="toggleDark()"><span id="darkIcon" aria-hidden="true">☀️</span></button>
</div>

<div id="app" class="app hidden">
  <header class="appbar">
    <button type="button" class="home-link" onclick="go('home')" aria-label="Home"><img class="logo-img" src="img/logo.png" alt="Wiwe Apartments"></button>
    <button type="button" class="sync" id="syncBadge" onclick="forceSync()"><span class="dot"></span><span id="syncText">Connecting…</span></button>
    <div class="me" id="meBox"></div>
  </header>
  <div class="main">
    <header class="topbar">
      <div class="titles">
        <span class="eyebrow" id="pageEyebrow"></span>
        <h1 id="pageTitle"></h1>
      </div>
      <div id="topActions" class="top-actions"></div>
    </header>
    <main id="view" class="content"></main>
    <div class="quick-sheet hidden" id="quickSheet" role="menu" aria-label="Quick actions"></div>
    <nav class="bottom-bar" id="bottomBar" aria-label="Phone navigation"></nav>
  </div>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-card" id="modalCard">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="icon-btn" type="button" aria-label="Close" onclick="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
</body>
</html>
